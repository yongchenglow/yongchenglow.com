# Resource profile for ephemeral pull-request review apps.
replicaCount: 1

commonLabels:
  team: frontend
  project: yongchenglow
  cost-center: personal
  environment: review

image:
  repository: yongchenglow
  pullPolicy: Always
  tag: review

service:
  type: NodePort
  port: 3000
  nodePort: 31000 # Overridden by the review deployment workflow.

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

env:
  - name: NODE_ENV
    value: production
  - name: NEXT_PUBLIC_ENV
    value: review

resources:
  limits:
    cpu: 250m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

ingress:
  enabled: false

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

featureBranch:
  enabled: true
  portMappingNamespace: default
