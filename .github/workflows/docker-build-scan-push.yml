name: Docker Build, Scan & Push

on:
  workflow_call:
    inputs:
      bun_version:
        description: "Bun version extracted from package.json"
        required: true
        type: string
      dhi_login:
        description: "Whether to authenticate to Docker Hardened Images"
        required: false
        type: boolean
        default: false
      registry:
        description: "Container registry"
        required: false
        type: string
        default: "ghcr.io"
      image_name:
        description: "Image name (defaults to repository name)"
        required: false
        type: string
        default: ""
      platform:
        description: "Target platform"
        required: false
        type: string
        default: "linux/amd64"
      tag_prefix:
        description: "Prefix for the immutable image tag"
        required: false
        type: string
        default: ""
    outputs:
      image_tag:
        description: "The immutable tag applied to the scanned image"
        value: ${{ jobs.container.outputs.image_tag }}
      image_name:
        description: "The full lowercase image name"
        value: ${{ jobs.container.outputs.image_name }}
    secrets:
      DHI_REGISTRY_USERNAME:
        description: "Docker Hardened Images username"
        required: false
      DHI_REGISTRY_PASSWORD:
        description: "Docker Hardened Images password"
        required: false

permissions:
  contents: read

jobs:
  container:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_tag: ${{ steps.generate-tag.outputs.tag }}
      image_name: ${{ steps.image-name.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hardened Images registry
        if: inputs.dhi_login
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_REGISTRY_USERNAME }}
          password: ${{ secrets.DHI_REGISTRY_PASSWORD }}

      - name: Determine image name
        id: image-name
        env:
          CONFIGURED_IMAGE_NAME: ${{ inputs.image_name }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          IMAGE_NAME="${CONFIGURED_IMAGE_NAME:-$GITHUB_REPOSITORY}"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "value=$REGISTRY/$IMAGE_NAME_LOWER" >> "$GITHUB_OUTPUT"

      - name: Generate immutable image tag
        id: generate-tag
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          if [ -n "$TAG_PREFIX" ]; then
            PREFIX="$TAG_PREFIX"
          else
            PREFIX=$(echo "$GITHUB_REF_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "tag=$PREFIX-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-name.outputs.value }}
          tags: |
            type=raw,value=${{ steps.generate-tag.outputs.prefix }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.generate-tag.outputs.tag }}

      - name: Extract package version
        id: package-version
        run: |
          VERSION=$(jq -r '.version // "0.0.0"' package.json)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract build date
        id: build-date
        run: echo "value=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine DHI Bun series tag
        id: dhi-bun-tag
        env:
          BUN_VERSION: ${{ inputs.bun_version }}
        run: echo "value=$(echo "$BUN_VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      # Loading the image into the local Docker daemon lets Trivy inspect the
      # exact image that will be pushed. Nothing is published before the scan.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUN_VERSION=${{ inputs.bun_version }}
            DHI_BUN_TAG=${{ steps.dhi-bun-tag.outputs.value }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
            REVISION=${{ github.sha }}
            VERSION=${{ steps.package-version.outputs.value }}
          cache-from: |
            type=gha,scope=${{ steps.generate-tag.outputs.prefix }}
            type=gha,scope=main
          cache-to: type=gha,mode=max,scope=${{ steps.generate-tag.outputs.prefix }}
          platforms: ${{ inputs.platform }}

      - name: Scan local image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-name.outputs.value }}:${{ steps.generate-tag.outputs.tag }}
          format: "json"
          output: "trivy-image-results.json"
          severity: "CRITICAL,HIGH"
          scan-type: "image"

      - name: Convert scan results to SARIF
        run: trivy convert --format sarif --output trivy-image-results.sarif trivy-image-results.json

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-image-results.sarif"

      - name: Enforce vulnerability policy
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]?
            | select(.Severity == "CRITICAL")] | length' trivy-image-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]?
            | select(.Severity == "HIGH")] | length' trivy-image-results.json)

          echo "Findings: $CRITICAL critical, $HIGH high"

          if [ "$HIGH" -gt 0 ]; then
            echo "HIGH severity (reported, not blocking):"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH") |
              "  - \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"' \
              trivy-image-results.json
          fi

          if [ "$CRITICAL" -gt 0 ]; then
            echo "CRITICAL vulnerabilities found:"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL") |
              "  - \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"' \
              trivy-image-results.json
            exit 1
          fi

          echo "No CRITICAL vulnerabilities"

      # Registry credentials are deliberately unavailable until the local
      # image has passed its vulnerability policy.
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
        run: docker image push --all-tags "$IMAGE_NAME"
