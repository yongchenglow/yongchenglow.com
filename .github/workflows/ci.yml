name: CI/CD

on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  extract-bun-version:
    name: Extract Bun Version from package.json
    runs-on: ubuntu-latest
    outputs:
      bun_version: ${{ steps.get-bun-version.outputs.bun_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get Bun version from package.json
        id: get-bun-version
        run: |
          BUN_VERSION=$(jq -r '.packageManager | split("@")[1]' package.json)
          if [ -z "$BUN_VERSION" ] || [ "$BUN_VERSION" = "null" ]; then
            echo "✗ ERROR: Could not read bun version from package.json packageManager field"
            exit 1
          fi
          echo "bun_version=$BUN_VERSION" >> $GITHUB_OUTPUT

  secret-scan:
    name: Secret Scan
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-secret-scan.yml
    secrets: inherit

  build:
    name: Quality Checks
    permissions:
      contents: read
      security-events: write
    needs: extract-bun-version
    uses: ./.github/workflows/reusable-build.yml
    with:
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}

  docker:
    name: Build & Push Docker Image
    needs: [build, secret-scan, extract-bun-version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}
      platforms: linux/amd64
    secrets: inherit

  security-scan:
    name: Security Scan
    needs: docker
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
    secrets: inherit

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    needs: [docker, security-scan, extract-bun-version]
    permissions:
      contents: read
      packages: read
      deployments: write
    uses: ./.github/workflows/production-deploy.yml
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}
    secrets: inherit
