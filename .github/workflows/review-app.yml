name: Review App

# Build and deploy the pull request merge commit, then remove every resource
# when the pull request closes. Forks still receive quality checks, but never
# receive access to deployment credentials.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  extract-bun-version:
    name: Extract Bun Version from package.json
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bun_version: ${{ steps.get-bun-version.outputs.bun_version }}
    steps:
      - name: Checkout package.json
        uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Get Bun version from package.json
        id: get-bun-version
        run: |
          BUN_VERSION=$(jq -r '.packageManager | split("@")[1]' package.json)
          if [ -z "$BUN_VERSION" ] || [ "$BUN_VERSION" = "null" ]; then
            echo "Could not read the Bun version from package.json"
            exit 1
          fi
          echo "bun_version=$BUN_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Quality Checks
    if: github.event.action != 'closed'
    needs: extract-bun-version
    permissions:
      contents: read
      security-events: write
    uses: yongchenglow/ci-workflows/.github/workflows/reusable-build.yml@v2
    with:
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}

  secret-scan:
    name: Secret Scan
    if: github.event.action != 'closed'
    permissions:
      contents: read
      security-events: write
    uses: yongchenglow/ci-workflows/.github/workflows/reusable-secret-scan.yml@v2
    secrets: inherit

  docker:
    name: Build & Push Review Image
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    needs: [extract-bun-version, build, secret-scan]
    permissions:
      contents: read
      packages: write
    uses: yongchenglow/ci-workflows/.github/workflows/reusable-docker.yml@v2
    with:
      bun_version: ${{ needs.extract-bun-version.outputs.bun_version }}
      dhi_login: true
      platforms: linux/amd64
      tag_prefix: pr-${{ github.event.number }}
    secrets: inherit

  security-scan:
    name: Security Scan
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    needs: docker
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: yongchenglow/ci-workflows/.github/workflows/reusable-security-scan.yml@v2
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
    secrets: inherit

  deploy:
    name: Deploy Review App
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    needs: [docker, security-scan]
    permissions:
      contents: read
      packages: read
      deployments: write
    uses: yongchenglow/ci-workflows/.github/workflows/review-deploy.yml@v2
    with:
      image_tag: ${{ needs.docker.outputs.image_tag }}
      review_id: pr-${{ github.event.number }}
      application_name: yongchenglow
      production_namespace: personal-site
      release_name: web
      review_domain: review.${{ vars.CLOUDFLARE_DOMAIN }}
      cloudflare_zone: ${{ vars.CLOUDFLARE_DOMAIN }}
    secrets: inherit

  cleanup:
    name: Tear Down Review App
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      deployments: write
    uses: yongchenglow/ci-workflows/.github/workflows/review-cleanup.yml@v2
    with:
      review_id: pr-${{ github.event.number }}
      application_name: yongchenglow
      release_name: web
      review_domain: review.${{ vars.CLOUDFLARE_DOMAIN }}
      cloudflare_zone: ${{ vars.CLOUDFLARE_DOMAIN }}
    secrets: inherit
