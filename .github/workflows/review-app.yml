name: Review App

# Build and deploy the pull request merge commit, then remove every resource
# when the pull request closes. Forks still receive quality checks, but never
# receive access to deployment credentials.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# Least privilege by default. Jobs that need more request it explicitly, and a
# job added later cannot silently inherit a broader repository default.
permissions:
  contents: read

# Supersede in-flight runs for the same pull request. A new push makes the
# previous review deployment obsolete, so finishing it only delays the current
# one and risks the two racing on the same namespace.
concurrency:
  group: review-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  bun-version:
    name: Extract Bun Version
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bun_version: ${{ steps.bun.outputs.bun_version }}
    steps:
      - name: Checkout package.json
        uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Get Bun version from package.json
        id: bun
        uses: yongchenglow/ci-workflows/.github/actions/bun-version@v2

  actionlint:
    name: Lint Workflows
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  build:
    name: Quality Checks
    if: github.event.action != 'closed'
    needs: bun-version
    permissions:
      contents: read
      security-events: write
    # v2.0.3 resolved on 2026-09-16.
    uses: yongchenglow/ci-workflows/.github/workflows/reusable-build.yml@v2
    with:
      bun_version: ${{ needs.bun-version.outputs.bun_version }}

  secret-scan:
    name: Secret Scan
    if: github.event.action != 'closed'
    permissions:
      contents: read
      security-events: write
    # v2.0.3 resolved on 2026-09-16.
    uses: yongchenglow/ci-workflows/.github/workflows/reusable-secret-scan.yml@v2

  helm-validate:
    name: Helm Lint & Render
    if: github.event.action != 'closed'
    permissions:
      contents: read
    # v2.0.3 resolved on 2026-09-16.
    uses: yongchenglow/ci-workflows/.github/workflows/helm-lint.yml@v2
    with:
      chart_path: helm/app
      # The chart requires a {branch}-{40-char-sha} tag, which the committed
      # placeholder does not satisfy. Render with a representative tag so
      # linting exercises the same substitution the deploy performs.
      image_tag: main-0000000000000000000000000000000000000000
      image_repository: ghcr.io/${{ github.repository }}
      # release|values_file|namespace. Kept identical to ci.yml so main and pull
      # requests cannot validate different charts.
      profiles: |
        web|helm/app/values-production.yaml|personal-site
        web|helm/app/values-review.yaml|personal-site-review

  # Every quality and security check converges here. The image is built once,
  # scanned locally, and only the exact image that passed is then published.
  container:
    name: Build, Scan & Push Review Image
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    needs: [bun-version, build, secret-scan, helm-validate, actionlint]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build-scan-push.yml
    with:
      bun_version: ${{ needs.bun-version.outputs.bun_version }}
      dhi_login: true
      platform: linux/amd64
      tag_prefix: pr-${{ github.event.number }}
    secrets:
      DHI_REGISTRY_USERNAME: ${{ secrets.DHI_REGISTRY_USERNAME }}
      DHI_REGISTRY_PASSWORD: ${{ secrets.DHI_REGISTRY_PASSWORD }}

  deploy:
    name: Deploy Review App
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    needs: container
    permissions:
      contents: read
      packages: read
      deployments: write
    # v2.0.3 resolved on 2026-09-16.
    uses: yongchenglow/ci-workflows/.github/workflows/review-deploy.yml@v2
    with:
      image_tag: ${{ needs.container.outputs.image_tag }}
      review_id: pr-${{ github.event.number }}
      application_name: yongchenglow
      production_namespace: personal-site
      release_name: web
      review_domain: review.${{ vars.CLOUDFLARE_DOMAIN }}
      cloudflare_zone: ${{ vars.CLOUDFLARE_DOMAIN }}
    secrets:
      KUBECONFIG_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
      KUBECONFIG_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}

  cleanup:
    name: Tear Down Review App
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      deployments: write
    # v2.0.3 resolved on 2026-09-16.
    uses: yongchenglow/ci-workflows/.github/workflows/review-cleanup.yml@v2
    with:
      review_id: pr-${{ github.event.number }}
      application_name: yongchenglow
      release_name: web
      review_domain: review.${{ vars.CLOUDFLARE_DOMAIN }}
      cloudflare_zone: ${{ vars.CLOUDFLARE_DOMAIN }}
    secrets:
      KUBECONFIG_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
      KUBECONFIG_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
