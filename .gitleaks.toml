[extend]
useDefault = true

[allowlist]
description = "Build artifacts, lockfiles, and Next.js public env vars"
paths = [
  '''^\.next/''',
  '''^node_modules/''',
  '''^out/''',
  '''^coverage/''',
  '''^public/search-index\.json$''',
  '''^bun\.lock$''',
  '''^\.env\.production$''',
]
regexes = [
  '''NEXT_PUBLIC_[A-Z_]+=[A-Za-z0-9_-]+''',
  '''ca-pub-[0-9]+''',
  '''G-[0-9A-Z]{4,10}''',
]
